[alembic]
script_location = sieve/db/migrations
prepend_sys_path = .
# Alembic 1.16+ deprecates the implicit separator; without this every migration run emits a
# DeprecationWarning, which `filterwarnings = ["error"]` turns into a test setup error.
path_separator = os
file_template = %%(rev)s_%%(slug)s
# `sqlalchemy.url` is deliberately absent: env.py reads settings.database_url (DATABASE_URL),
# so the same migrations run locally, in compose and in CI without editing this file.
