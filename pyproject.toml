[project]
name = "sieve"
version = "0.1.0"
description = "A precision layer for MCP tool-poisoning findings"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "numpy>=2.0,<2.4",  # 2.5.x wheels are blocked by Windows Smart App Control on the dev box
  "pyyaml>=6.0",
  "typer>=0.12",  # sieve.cli.app -- the [project.scripts] entry point, so not optional (PRD §15.1)
  "rich>=13",
]

[project.scripts]
sieve = "sieve.cli.app:main"

[project.optional-dependencies]
# `psycopg[binary]<3.3.5`: same Windows Smart App Control wheel block as numpy above -- SAC
# refuses the newest compiled wheels on the dev box, and the pin is one release behind for that
# reason alone. `httpx2`/`httpcore2` are declared, not inherited: `sieve/worker/ssrf_client.py`
# subclasses `httpcore2.AnyIOBackend` and `httpx2.AsyncHTTPTransport` directly, and until fix
# round 2's I5 they resolved only because `mcp` and `anthropic` happen to pull them in -- a
# transitive release that swapped its transport would have broken the sandbox worker at import
# time, with a lockfile refresh as the only signal.
api = ["fastapi", "uvicorn[standard]", "sqlalchemy[asyncio]>=2.0", "alembic", "psycopg[binary]<3.3.5", "sse-starlette", "python-multipart", "httpx", "httpx2>=2.12", "httpcore2>=2.12"]
model = [
    "torch",
    "transformers",
    "accelerate",
    "datasets",
    # <1.9.1 for the same Windows Smart App Control reason as numpy and psycopg: the newest
    # scikit-learn wheels are blocked on the dev box. Not a compatibility constraint -- do not
    # "helpfully" unpin it without testing on a Windows box with Smart App Control on.
    "scikit-learn<1.9.1",
    "onnxruntime",
    "optimum[onnxruntime]",
    "huggingface_hub",
    "sentence-transformers",
    # scipy <1.18 and pyarrow <25.0.1: the same Smart App Control block again. scipy 1.18.x's
    # `scipy.spatial` DLLs and pyarrow 25.0.1's `_dataset` DLL are refused on the dev box, and
    # `transformers.Trainer` imports both, so training cannot start. Measured 2026-09-21.
    "scipy<1.18",
    "pyarrow<25.0.1",
    "sentencepiece>=0.2.2",
]
judge = ["anthropic>=1.0"]
cli = []  # typer/rich moved to base dependencies (the [project.scripts] entry point needs them
          # unconditionally); kept as an empty extra so `uv sync --extra cli` in CI still resolves.
# `sieve/mcp_server/server.py` imports `httpx2` directly (see the `api` extra's note on I5).
mcp = ["mcp", "httpx2>=2.12", "httpcore2>=2.12"]
bench = ["textual", "httpx", "tree-sitter", "tree-sitter-python", "tree-sitter-typescript", "jsonschema"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "hypothesis",
    "ruff",
    "mypy",
    "types-requests",
    "pip-audit",
    "types-pyyaml",
]

# PyPI's Windows torch wheels are CPU-only, so the dev box's GPU was invisible to training.
# Windows alone resolves torch from PyTorch's CUDA 12.6 index; Linux (CI, the Docker images)
# keeps PyPI's torch unchanged. `explicit` keeps every other package off that index.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's own documented pattern: `Depends(...)`/`Query(...)` as an argument default is how
# dependency injection works, not a mutable-default bug (B008's usual target).
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["sieve"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "error",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
  "ignore:`huggingface_hub` cache-system uses symlinks by default:UserWarning",
]
pythonpath = ["."]
markers = [
  "slow: long-running (model training, ONNX export); run in the `model` CI job",
  "docker: needs a Docker daemon; skipped in CI",
  "holdout: opens a sealed holdout file; run once, in Phase 4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sieve"]
