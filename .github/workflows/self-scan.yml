name: self-scan
on:
  pull_request:
jobs:
  sieve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./action
        with:
          config: fixtures/mcp-config/sample.mcp.json
          sieve-version: local
          fail-on: confirmed
          upload-sarif: true
          comment: true
