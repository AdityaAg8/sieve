services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: sieve, POSTGRES_PASSWORD: sieve, POSTGRES_DB: sieve }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U sieve"], interval: 5s, retries: 10 }
  api:
    build: { context: ., dockerfile: Dockerfile.api }
    env_file: [{ path: .env, required: false }]
    # Both gates are pinned, not inherited. Compose's `env_file:` sets real environment
    # variables (unlike pydantic's dotenv, which only fills unset fields), so without these
    # two lines a root .env could open either gate here; `environment:` beats `env_file:` (SC-1).
    environment: { DATABASE_URL: postgresql+psycopg://sieve:sieve@postgres:5432/sieve, WEB_ORIGIN: http://localhost:3000, SIEVE_ALLOW_REMOTE_MCP: "false", SIEVE_SANDBOXED: "0" }
    ports: ["8000:8000"]
    depends_on: { postgres: { condition: service_healthy } }
  worker:
    build: { context: ., dockerfile: Dockerfile.api }
    env_file: [{ path: .env, required: false }]
    environment: { DATABASE_URL: postgresql+psycopg://sieve:sieve@postgres:5432/sieve, SIEVE_ALLOW_REMOTE_MCP: "false", SIEVE_SANDBOXED: "0" }
    command: ["uv", "run", "python", "-m", "sieve.worker.main"]
    depends_on: { postgres: { condition: service_healthy } }
  sandbox-worker:
    profiles: ["remote"]
    build: { context: ., dockerfile: Dockerfile.sandbox }
    env_file: [{ path: .env, required: false }]
    # SIEVE_SANDBOXED is the second gate, and it is independent only because api and worker
    # pin it to "0": the runtime refuses a remote fetch unless it reads exactly "1" here.
    environment: { DATABASE_URL: postgresql+psycopg://sieve:sieve@postgres:5432/sieve, SIEVE_ALLOW_REMOTE_MCP: "true", SIEVE_SANDBOXED: "1" }
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    depends_on: { postgres: { condition: service_healthy } }
  web:
    image: node:22-slim
    working_dir: /web
    volumes: ["./web:/web"]
    env_file: [{ path: .env, required: false }]
    command: ["sh", "-c", "npm ci && npm run dev"]
    environment: { NEXT_PUBLIC_API_URL: http://localhost:8000 }
    ports: ["3000:3000"]
